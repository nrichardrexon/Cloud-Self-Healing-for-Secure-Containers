# policies.yaml - baseline fault injection policies for Module 5
apiVersion: v1
kind: ConfigMap
metadata:
  name: faultinjector-policies
data:
  policies: |
    - name: cpu_stress_test
      description: Simulate high CPU usage for short intervals
      namespace: monitoring
      targetLabel: app=remediator
      duration: 20s
      intensity: medium

    - name: memory_stress_test
      description: Simulate high memory usage
      namespace: monitoring
      targetLabel: app=remediator
      duration: 15s
      intensity: high

    - name: pod_kill_test
      description: Randomly terminate one pod to trigger self-healing
      namespace: monitoring
      targetLabel: app=remediator
      probability: 0.3
