apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: faultinjector-sa
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: faultinjector-role
  namespace: monitoring
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/exec
  - pods/log
  verbs:
  - get
  - list
  - delete
  - create
  - update
  - patch
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: faultinjector-rolebinding
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: faultinjector-role
subjects:
- kind: ServiceAccount
  name: faultinjector-sa
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: faultinjector
    module: '5'
    phase: fault-injection
  name: test-remediator
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faultinjector
  template:
    metadata:
      labels:
        app: faultinjector
        managed-by: remediator
    spec:
      containers:
      - args:
        - "echo \"\u2705 Fault Injector Ready: Running in 'monitoring' namespace (Module\
          \ 5 integrated with Module 4 Remediator')\";\nwhile true; do\n  python3\
          \ /app/scripts/fault_injection.py;\n  sleep 60;\ndone\n"
        command:
        - /bin/bash
        - -c
        env:
        - name: NAMESPACE
          value: monitoring
        - name: LABEL_SELECTOR
          value: app=faultinjector
        image: module5-faultinjector:latest
        imagePullPolicy: IfNotPresent
        name: faultinjector
        ports:
        - containerPort: 9090
          name: metrics
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: faultinjector-sa
