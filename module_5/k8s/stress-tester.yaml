apiVersion: v1
kind: Pod
metadata:
  name: stress-tester
  namespace: monitoring
  labels:
    app: stress-tester
spec:
  containers:
    - name: stress
      image: progrium/stress
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: true
  restartPolicy: Never
