global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@example.com'

route:
  group_by: ['alertname', 'action']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'remediator-webhook'
  routes:
  - match:
      action: restart
    receiver: 'remediator-webhook'
  - match:
      action: scale
    receiver: 'remediator-webhook'
  - match:
      action: rollback
    receiver: 'remediator-webhook'
  - match:
      action: quarantine
    receiver: 'remediator-webhook'

receivers:
- name: 'remediator-webhook'
  webhook_configs:
  - url: 'http://remediator-service:8080/alert'
    send_resolved: true
    http_config:
      basic_auth:
        username: 'user'
        password: 'pass'