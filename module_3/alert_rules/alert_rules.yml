groups:
- name: app.rules
  rules:
  # ----------------------------
  # ⚠️ Container Restarts
  # ----------------------------
  - alert: ContainerRestart
    expr: rate(kube_pod_container_status_restarts_total[5m]) > 0
    for: 1m
    labels:
      severity: warning
      action: restart
    annotations:
      summary: "Pod {{ $labels.pod }} is restarting"
      description: "Container is restarting frequently in namespace {{ $labels.namespace }}. Trigger auto-restart."

  # ----------------------------
  # 🔥 High CPU Usage
  # ----------------------------
  - alert: HighCPUUsage
    expr: sum by (pod, namespace) (rate(container_cpu_usage_seconds_total[2m]))
          / sum by (pod, namespace) (kube_pod_container_resource_limits_cpu_cores) > 0.8
    for: 2m
    labels:
      severity: critical
      action: scale
    annotations:
      summary: "Pod {{ $labels.pod }} high CPU usage"
      description: "CPU usage >80% of requested cores for pod {{ $labels.pod }}. Trigger horizontal scale-up."

  # ----------------------------
  # 🧠 High Memory Usage
  # ----------------------------
  - alert: HighMemoryUsage
    expr: sum by (pod, namespace) (container_memory_usage_bytes)
          / sum by (pod, namespace) (kube_pod_container_resource_limits_memory_bytes) > 0.8
    for: 2m
    labels:
      severity: critical
      action: scale
    annotations:
      summary: "Pod {{ $labels.pod }} high memory usage"
      description: "Memory usage >80% of memory limit for pod {{ $labels.pod }}. Trigger horizontal scale-up."

  # ----------------------------
  # ❌ Failing Readiness
  # ----------------------------
  - alert: ReadinessProbeFailing
    expr: kube_pod_container_status_ready{condition="false"} == 1
    for: 2m
    labels:
      severity: warning
      action: restart
    annotations:
      summary: "Pod {{ $labels.pod }} readiness probe failing"
      description: "Readiness probe failing for pod {{ $labels.pod }}. Trigger restart."

  # ----------------------------
  # 🚨 Deployment Failure
  # ----------------------------
  - alert: DeploymentFailure
    expr: kube_deployment_status_replicas_unavailable > 0
    for: 3m
    labels:
      severity: critical
      action: rollback
    annotations:
      summary: "Deployment {{ $labels.deployment }} failing"
      description: "Unhealthy deployment detected. Trigger rollback to previous stable version."

  # ----------------------------
  # 🧩 Module 2 Metrics Endpoint Down
  # ----------------------------
  - alert: Module2MetricsEndpointDown
    expr: absent(up{job="module-2-app"} == 1)
    for: 1m
    labels:
      severity: critical
      action: restart
    annotations:
      summary: "Module 2 metrics endpoint unreachable"
      description: "Prometheus cannot scrape /metrics from Module 2 app. Trigger pod restart."
