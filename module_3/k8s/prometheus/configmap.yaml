apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'module-1-app'
        static_configs:
          - targets: ['sample-app.default.svc.cluster.local:5000']

      - job_name: 'module-2-app'
        static_configs:
          - targets: ['module-2-sample-app.default.svc.cluster.local:8000']

      - job_name: 'remediator'
        static_configs:
          - targets: ['remediator-service.monitoring.svc.cluster.local:8080']

    rule_files:
      - "/etc/prometheus/alert_rules/*.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - 'alertmanager.monitoring.svc.cluster.local:9093'
