apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # Use the ServiceAccount we defined earlier
      serviceAccountName: prometheus

      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
            - "--web.listen-address=:9090"
            # Enable service account token for in-cluster auth
            - "--enable-feature=kubernetes-service-accounts"

          ports:
            - containerPort: 9090
              name: web

          volumeMounts:
            # Core Prometheus config
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml

            # Alert rules
            - name: prometheus-rules
              mountPath: /etc/prometheus/alert_rules

            # Kubelet and cAdvisor scrape configs
            - name: prometheus-kubelet
              mountPath: /etc/prometheus/kubernetes-kubelet.yaml
              subPath: prometheus.yml
            - name: prometheus-cadvisor
              mountPath: /etc/prometheus/kubernetes-cadvisor.yaml
              subPath: prometheus.yml

          # Health checks
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      # ✅ Add default automount for service account token
      automountServiceAccountToken: true

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-rules
          configMap:
            name: prometheus-rules
        - name: prometheus-kubelet
          configMap:
            name: prometheus-kubernetes-kubelet
        - name: prometheus-cadvisor
          configMap:
            name: prometheus-kubernetes-cadvisor
