apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  selector:
    app: alertmanager
  ports:
    - name: alertmanager-http
      port: 9093
      targetPort: 9093
    - name: remediator-metrics
      port: 8080
      targetPort: 8080
  type: ClusterIP
