apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--log.level=info"
            - "--web.listen-address=0.0.0.0:9093"
          ports:
            - containerPort: 9093
          env:
            - name: ALERTMANAGER_USER
              valueFrom:
                secretKeyRef:
                  name: alertmanager-basic-auth
                  key: smtp_user
            - name: ALERTMANAGER_PASS
              valueFrom:
                secretKeyRef:
                  name: alertmanager-basic-auth
                  key: smtp_pass
          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config
