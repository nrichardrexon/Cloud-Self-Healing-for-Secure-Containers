apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m
      smtp_require_tls: true

    route:
      receiver: 'default-receiver'
      group_by: ['alertname', 'namespace', 'pod', 'action']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 2m

      routes:
        # 🚀 Restart Actions
        - match:
            action: restart
          receiver: 'remediator-webhook'
          continue: true

        # ⚙️ Scale Actions
        - match:
            action: scale
          receiver: 'remediator-webhook'
          continue: true

        # 🔁 Rollback Actions
        - match:
            action: rollback
          receiver: 'remediator-webhook'
          continue: true

        # 🧩 Default Fallback
        - receiver: 'default-receiver'

    receivers:
      # 🧠 Primary automation receiver for remediation
      - name: 'remediator-webhook'
        webhook_configs:
          - url: 'http://remediator.monitoring.svc.cluster.local:8080/remediate'
            send_resolved: true
            http_config:
              follow_redirects: true
              enable_http2: true
            max_alerts: 10

      # ✉️ Fallback / Test receiver (logs instead of real email)
      - name: 'default-receiver'
        email_configs:
          - to: 'alerts-log@example.com'
            from: 'no-reply@example.com'
            smarthost: 'smtp.gmail.com:587'
            auth_username: 'no-reply@example.com'
            auth_identity: 'no-reply@example.com'
            auth_password: 'change_me'
            send_resolved: true
            headers:
              subject: '[TEST ALERT] Fallback route triggered'
