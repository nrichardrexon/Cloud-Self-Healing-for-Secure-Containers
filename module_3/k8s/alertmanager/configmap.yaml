apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m

    route:
      receiver: 'remediator-webhook'
      group_by: ['alertname', 'namespace', 'pod', 'action']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 2m

      routes:
        - match:
            action: restart
          receiver: 'remediator-webhook'
        - match:
            action: scale
          receiver: 'remediator-webhook'
        - match:
            action: rollback
          receiver: 'remediator-webhook'

    receivers:
      - name: 'remediator-webhook'
        webhook_configs:
          - url: 'http://remediator-service.monitoring.svc.cluster.local:8080/alert'
            send_resolved: true

      - name: 'default-receiver'
        email_configs:
          - to: 'alerts-team@example.com'
            from: 'no-reply@example.com'
            smarthost: 'smtp.gmail.com:587'
            auth_username: 'no-reply@example.com'
            auth_identity: 'no-reply@example.com'
            auth_password: 'change_me'
            send_resolved: true
