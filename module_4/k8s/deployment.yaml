apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: remediator
  name: remediator
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediator
  template:
    metadata:
      labels:
        app: remediator
    spec:
      containers:
      - image: remediator:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        name: remediator
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - mountPath: /app/policies.yaml
          name: policies-volume
          readOnly: false
          subPath: policies.yaml
      restartPolicy: Always
      volumes:
      - configMap:
          items:
          - key: policies.yaml
            path: policies.yaml
          name: remediator-policies
        name: policies-volume
